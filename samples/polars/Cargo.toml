[package]
name = "polars_demo"
version = "0.1.0"
edition = "2024"
# 示例 crate，不发布到 crates.io（否则 workspace 级 cargo publish 会校验它的 path 依赖）
publish = false

[dependencies]
tqsdk-rs = { path = "../../tqsdk-rs", features = ['polars'] }

tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.17"
async-stream = "0.3.6"
async-channel = "2.3.1"
futures = "0.3.31"

# Async trait
async-trait = "0.1.89"

# JSON
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "fmt",
    "ansi",
] }

chrono = { version = "0.4.42", features = ["serde"] }

polars = { version = "0.44.2", features = ["lazy", "dtype-datetime"] }
